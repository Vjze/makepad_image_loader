[package]
name = "ely_gpui_app"
version = "0.1.0"
edition = "2024"

[dependencies]
ely-core = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", package = "ely-core", features = ["platform"] }
ely-media = { git = "https://github.com/ELY-Open-Source/Ely-GPUI-Components", package = "ely-media" }
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10" } # 保留声明，但不需要手动写 features = [...] 了
image_loader_core = { path = "../core" }
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff", "pnm"] }